<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Guessr</title>
  <style>
    body { margin:0; font-family: Arial; }
    #root { display:flex; height:100vh; }
    #pano { flex: 1; }
    #side { width: 420px; display:flex; flex-direction:column; border-left:1px solid #ddd; }
    #map { flex:1; }
    #panel { padding:12px; display:flex; gap:10px; align-items:center; border-top:1px solid #ddd; }
    button { padding:10px 12px; cursor:pointer; }
    .small { font-size: 13px; opacity: .8; }
  </style>
</head>
<body>
  <div id="root">
    <div id="pano"></div>
    <div id="side">
      <div id="map"></div>
      <div id="panel">
        <button id="submit">Submit Guess</button>
        <button id="close" style="display:none;">Close</button>
        <div>
          <div id="roundinfo">Round: 1/3 | Total: 0</div>
          <div id="status">Click a point on the map.</div>
          <div class="small" id="result"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://maps.googleapis.com/maps/api/js?key=API_KEY"></script>
  <script>
    let map, pano, guessMarker = null;
    let guessLatLng = null;

    function setRoundUI(round, total, totalScore) {
      document.getElementById("roundinfo").innerText = `Round: ${round}/${total} | Total: ${totalScore}`;
    }

    function resetGuess() {
      guessLatLng = null;
      if (guessMarker) {
        guessMarker.setMap(null);
        guessMarker = null;
      }
      document.getElementById("status").innerText = "Click a point on the map.";
    }

    async function onSubmit() {
      if (!guessLatLng) {
        document.getElementById("status").innerText = "Click on the map first!";
        return;
      }

      const res = await window.pywebview.api.submit_guess(guessLatLng.lat(), guessLatLng.lng());

      document.getElementById("result").innerText =
        `Round score: ${res.score} | Distance: ${res.distance_km.toFixed(2)} km | Total: ${res.total_score}`;

      setRoundUI(res.round, res.rounds_total, res.total_score);

      if (res.finished) {
        document.getElementById("status").innerText = "Game over!";
        document.getElementById("submit").disabled = true;
        document.getElementById("close").style.display = "inline-block";
        return;
      }

      // Next round: move Street View to the new target
      pano.setPosition(res.next_target);
      resetGuess();
    }

    async function init() {
      const state = await window.pywebview.api.get_state();
      setRoundUI(state.round, state.rounds_total, state.total_score);

      pano = new google.maps.StreetViewPanorama(document.getElementById("pano"), {
        position: state.target,
        pov: { heading: 0, pitch: 0 },
        zoom: 1,
        addressControl: false,
        fullscreenControl: true
      });

      map = new google.maps.Map(document.getElementById("map"), {
        center: {lat: 20, lng: 0},
        zoom: 2,
        streetViewControl: false,
        mapTypeControl: false
      });

      map.addListener("click", (e) => {
        guessLatLng = e.latLng;
        if (!guessMarker) {
          guessMarker = new google.maps.Marker({ map, position: guessLatLng });
        } else {
          guessMarker.setPosition(guessLatLng);
        }
        document.getElementById("status").innerText =
          `Selected: ${guessLatLng.lat().toFixed(5)}, ${guessLatLng.lng().toFixed(5)}`;
      });

      document.getElementById("submit").addEventListener("click", onSubmit);
      document.getElementById("close").addEventListener("click", async () => {
        await window.pywebview.api.close_window();
      });
    }

    // Most reliable event for pywebview
    window.addEventListener("pywebviewready", init);
  </script>
</body>
</html>
